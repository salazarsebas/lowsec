[package]
name = "lowsec"
description = "Lowsec: a mini EVE Frontier on NEAR. NEP-245 gold + cargo, contested lanes, burned cargo, AI Economic Council."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/<owner>/lowsec"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
